[Service]
ExecStart=
ExecStart=/usr/bin/java -Xms64m -Xmx384m -XX:+UseSerialGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:-ShrinkHeapInSteps -XX:+ExitOnOutOfMemoryError -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=32m -Xlog:gc*:file=/opt/dental-clinic/logs/gc.log:time,uptime,level,tags:filecount=4,filesize=4M -jar /opt/dental-clinic/app.jar
Environment=SERVER_TOMCAT_THREADS_MAX=25
Environment=SERVER_TOMCAT_THREADS_MIN_SPARE=3
Environment=SERVER_TOMCAT_MAX_CONNECTIONS=100
Environment=SERVER_TOMCAT_ACCEPT_COUNT=25
Environment=SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
Environment=SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=900000
MemoryAccounting=yes
MemoryHigh=650M
MemoryMax=768M
TimeoutStopSec=90
