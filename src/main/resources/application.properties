spring.application.name=dentalclinic
server.port=8080

#Activate a profile
spring.profiles.active=dev

# Email (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
app.contact.recipient-email=${APP_CONTACT_RECIPIENT_EMAIL:${SPRING_MAIL_USERNAME:mk8516054@gmail.com}}


# JWT settings (use a strong secret in production)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Razorpay
app.razorpay.key-id=${APP_RAZORPAY_KEY_ID}
app.razorpay.key-secret=${APP_RAZORPAY_KEY_SECRET}
app.razorpay.currency=${APP_RAZORPAY_CURRENCY:INR}
app.razorpay.webhook-secret=${APP_RAZORPAY_WEBHOOK_SECRET}

# File uploads
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Admin bootstrap (dev)
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}

# Respect X-Forwarded-* headers when running behind SSL-terminating proxy/load balancer
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Comma-separated CORS origin allow-list
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://gayatridental.com,https://www.gayatridental.com,http://localhost:*,http://127.0.0.1:*,http://localhost:5173,http://localhost:3000}
